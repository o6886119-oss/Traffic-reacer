<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Racer - Jungle Highway</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #111;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Mobile Touch Controls */
        .controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
        }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            font-size: 28px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }
        .ui-score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
            background: rgba(0,0,0,0.4);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        /* Menu Screens Overlay */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 12, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .screen h1 {
            font-size: 36px;
            color: #4CAF50;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }
        .screen p {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 30px;
        }
        .menu-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            transition: 0.2s;
            width: 220px;
        }
        .menu-btn:active {
            transform: scale(0.95);
            background: #43A047;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div class="ui-score" id="scoreDisplay">Score: 0</div>
        
        <!-- Main Menu Screen -->
        <div id="mainMenu" class="screen">
            <h1>TRAFFIC RACER</h1>
            <p>Jungle Highway Edition</p>
            <button class="menu-btn" onclick="startGame()">START GAME</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen hidden">
            <h1>CRASHED!</h1>
            <p id="finalScore">Score: 0</p>
            <button class="menu-btn" onclick="restartGame()">Play Again</button>
            <button class="menu-btn" style="background: #e53935;" onclick="goToMainMenu()">Main Menu</button>
        </div>

        <canvas id="gameCanvas" width="400" height="700"></canvas>
        
        <div class="controls">
            <div class="btn" id="leftBtn">◀</div>
            <div class="btn" id="rightBtn">▶</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const mainMenu = document.getElementById('mainMenu');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('finalScore');

        let score = 0;
        let gameActive = false;
        let gameSpeed = 6;

        // Player Car (Honda Civic Style - Red)
        let car = {
            x: canvas.width / 2 - 22,
            y: canvas.height - 140,
            width: 44,
            height: 85,
            dx: 0
        };

        // Highway boundaries
        const roadLeft = 50;
        const roadRight = canvas.width - 50;

        let obstacles = [];
        let obstacleTimer = 0;

        // Jungle Trees & Bushes for realistic background
        let scenery = [];
        for (let i = 0; i < 12; i++) {
            scenery.push({
                y: i * 70,
                leftX: 20 + Math.random() * 15,
                rightX: canvas.width - 35 - Math.random() * 15,
                size: 20 + Math.random() * 15
            });
        }

        // Touch Controls
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); car.dx = -5; });
        leftBtn.addEventListener('touchend', () => { car.dx = 0; });
        leftBtn.addEventListener('mousedown', () => { car.dx = -5; });
        leftBtn.addEventListener('mouseup', () => { car.dx = 0; });

        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); car.dx = 5; });
        rightBtn.addEventListener('touchend', () => { car.dx = 0; });
        rightBtn.addEventListener('mousedown', () => { car.dx = 5; });
        rightBtn.addEventListener('mouseup', () => { car.dx = 0; });

        // Keyboard support
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') car.dx = -5;
            if (e.key === 'ArrowRight') car.dx = 5;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') car.dx = 0;
        });

        function startGame() {
            mainMenu.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            score = 0;
            obstacles = [];
            car.x = canvas.width / 2 - 22;
            scoreDisplay.innerText = "Score: 0";
            gameActive = true;
            loop();
        }

        function restartGame() {
            gameOverScreen.classList.add('hidden');
            score = 0;
            obstacles = [];
            car.x = canvas.width / 2 - 22;
            scoreDisplay.innerText = "Score: 0";
            gameActive = true;
        }

        function goToMainMenu() {
            gameOverScreen.classList.add('hidden');
            mainMenu.classList.remove('hidden');
            gameActive = false;
        }

        function spawnObstacle() {
            let obsX = roadLeft + 15 + Math.random() * (roadRight - roadLeft - 60);
            obstacles.push({
                x: obsX,
                y: -120,
                width: 44,
                height: 85,
                speed: 3 + Math.random() * 2,
                color: '#2196F3' // Traffic car blue
            });
        }

        function update() {
            if (!gameActive) return;

            car.x += car.dx;
            if (car.x < roadLeft + 5) car.x = roadLeft + 5;
            if (car.x > roadRight - car.width - 5) car.x = roadRight - car.width - 5;

            // Move Scenery (Jungle effect)
            scenery.forEach(item => {
                item.y += gameSpeed;
                if (item.y > canvas.height) item.y = -50;
            });

            // Spawn Obstacles
            obstacleTimer++;
            if (obstacleTimer > 65) {
                spawnObstacle();
                obstacleTimer = 0;
            }

            // Move Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += gameSpeed - obstacles[i].speed;

                // Collision Detection
                if (
                    car.x < obstacles[i].x + obstacles[i].width - 6 &&
                    car.x + car.width > obstacles[i].x + 6 &&
                    car.y < obstacles[i].y + obstacles[i].height - 6 &&
                    car.y + car.height > obstacles[i].y + 6
                ) {
                    gameActive = false;
                    finalScore.innerText = "Score: " + score;
                    gameOverScreen.classList.remove('hidden');
                }

                // Remove passed obstacles & increase score
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 15;
                    scoreDisplay.innerText = "Score: " + score;
                }
            }
        }

        // Draw Detailed Car (Honda Civic Style with lights & windshield)
        function drawCar(x, y, bodyColor, isPlayer) {
            ctx.save();
            ctx.translate(x, y);

            // Car Body Shadow / Glow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(-3, 5, width = 48, height = 85);

            // Main Body
            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.roundRect(0, 0, 44, 85, [10, 10, 8, 8]);
            ctx.fill();

            // Roof / Cabin
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.roundRect(6, 22, 32, 40, [6, 6, 4, 4]);
            ctx.fill();

            // Front & Rear Windshields
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(8, 25, 28, 14); // Front/Rear glass
            ctx.fillRect(8, 44, 28, 14); // Rear glass

            // Headlights / Taillights
            if (isPlayer) {
                // Headlights (Glowing Yellow/White)
                ctx.fillStyle = '#fff';
                ctx.fillRect(3, 2, 8, 4);
                ctx.fillRect(33, 2, 8, 4);
            } else {
                // Taillights for traffic cars (Red glow)
                ctx.fillStyle = '#ff1744';
                ctx.fillRect(3, 2, 8, 4);
                ctx.fillRect(33, 2, 8, 4);
            }

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Grass / Jungle Background
            ctx.fillStyle = '#1b4d1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Jungle Trees on Sides
            scenery.forEach(item => {
                ctx.fillStyle = '#113513';
                ctx.beginPath();
                ctx.arc(item.leftX, item.y, item.size, 0, Math.PI * 2);
                ctx.arc(item.rightX, item.y, item.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 3. Asphalt Highway Road
            ctx.fillStyle = '#262626';
            ctx.fillRect(roadLeft, 0, roadRight - roadLeft, canvas.height);

            // Road Shoulder Borders (White lines)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(roadLeft, 0);
            ctx.lineTo(roadLeft, canvas.height);
            ctx.moveTo(roadRight, 0);
            ctx.lineTo(roadRight, canvas.height);
            ctx.stroke();

            // Center Dashed Yellow Lane Lines
            ctx.strokeStyle = '#fbc02d';
            ctx.lineWidth = 4;
            ctx.setLineDash([25, 25]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, -10);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // 4. Draw Traffic Cars (Obstacles)
            obstacles.forEach(obs => {
                drawCar(obs.x, obs.y, '#1e88e5', false); // Blue Traffic Car
            });

            // 5. Draw Player Car (Honda Civic Style - Sporty Red)
            drawCar(car.x, car.y, '#e53935', true);
        }

        function loop() {
            update();
            draw();
            if (gameActive) {
                requestAnimationFrame(loop);
            }
        }

        // Initial preview draw
        draw();
    </script>
</body>
</html>
