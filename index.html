<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Racer - 3D Perspective</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #090d16;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #111;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Touch Controls */
        .controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 35px;
            box-sizing: border-box;
            z-index: 10;
        }
        .btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: white;
            font-size: 28px;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.93);
        }
        .ui-score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 20, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .screen h1 {
            font-size: 38px;
            color: #ff3d00;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 61, 0, 0.6);
            letter-spacing: 2px;
        }
        .screen p {
            font-size: 16px;
            color: #b0bec5;
            margin-bottom: 30px;
        }
        .menu-btn {
            background: #ff3d00;
            color: white;
            border: none;
            padding: 16px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 20px rgba(255, 61, 0, 0.5);
            transition: 0.2s;
            width: 230px;
        }
        .menu-btn:active {
            transform: scale(0.95);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div class="ui-score" id="scoreDisplay">Score: 0</div>
        
        <!-- Main Menu -->
        <div id="mainMenu" class="screen">
            <h1>TRAFFIC RACER</h1>
            <p>3D Bridge & Highway Edition</p>
            <button class="menu-btn" onclick="startGame()">START GAME</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen hidden">
            <h1>CRASHED!</h1>
            <p id="finalScore">Score: 0</p>
            <button class="menu-btn" onclick="restartGame()">Play Again</button>
            <button class="menu-btn" style="background: #37474f;" onclick="goToMainMenu()">Main Menu</button>
        </div>

        <canvas id="gameCanvas" width="400" height="700"></canvas>
        
        <div class="controls">
            <div class="btn" id="leftBtn">◀</div>
            <div class="btn" id="rightBtn">▶</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const mainMenu = document.getElementById('mainMenu');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('finalScore');

        let score = 0;
        let gameActive = false;
        let roadOffset = 0;

        // Player Car (Sports Red Car - Viewed from behind)
        let car = {
            x: 200,
            y: 540,
            width: 50,
            height: 90,
            dx: 0
        };

        let obstacles = [];
        let obstacleTimer = 0;

        // Touch & Key Controls
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); car.dx = -6; });
        leftBtn.addEventListener('touchend', () => { car.dx = 0; });
        leftBtn.addEventListener('mousedown', () => { car.dx = -6; });
        leftBtn.addEventListener('mouseup', () => { car.dx = 0; });

        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); car.dx = 6; });
        rightBtn.addEventListener('touchend', () => { car.dx = 0; });
        rightBtn.addEventListener('mousedown', () => { car.dx = 6; });
        rightBtn.addEventListener('mouseup', () => { car.dx = 0; });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') car.dx = -6;
            if (e.key === 'ArrowRight') car.dx = 6;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') car.dx = 0;
        });

        function startGame() {
            mainMenu.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            score = 0;
            obstacles = [];
            car.x = 200;
            scoreDisplay.innerText = "Score: 0";
            gameActive = true;
            loop();
        }

        function restartGame() {
            gameOverScreen.classList.add('hidden');
            score = 0;
            obstacles = [];
            car.x = 200;
            scoreDisplay.innerText = "Score: 0";
            gameActive = true;
        }

        function goToMainMenu() {
            gameOverScreen.classList.add('hidden');
            mainMenu.classList.remove('hidden');
            gameActive = false;
        }

        function spawnObstacle() {
            let laneX = [125, 200, 275]; // 3 lanes
            let chosenX = laneX[Math.floor(Math.random() * laneX.length)];
            obstacles.push({
                x: chosenX - 25,
                y: -120,
                width: 50,
                height: 90,
                speed: 4,
                color: ['#1e88e5', '#43a047', '#ffeb3b', '#8e24aa'][Math.floor(Math.random() * 4)]
            });
        }

        function update() {
            if (!gameActive) return;

            car.x += car.dx;
            // Bridge road boundaries (Keep car on the bridge)
            if (car.x < 85) car.x = 85;
            if (car.x > 315 - car.width) car.x = 315 - car.width;

            roadOffset = (roadOffset + 7) % 40;

            obstacleTimer++;
            if (obstacleTimer > 60) {
                spawnObstacle();
                obstacleTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed + 3;

                // Collision Box
                if (
                    car.x < obstacles[i].x + obstacles[i].width - 8 &&
                    car.x + car.width > obstacles[i].x + 8 &&
                    car.y < obstacles[i].y + obstacles[i].height - 8 &&
                    car.y + car.height > obstacles[i].y + 8
                ) {
                    gameActive = false;
                    finalScore.innerText = "Score: " + score;
                    gameOverScreen.classList.remove('hidden');
                }

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 20;
                    scoreDisplay.innerText = "Score: " + score;
                }
            }
        }

        // Draw Detailed 3D-styled Car from Behind
        function drawCar(x, y, color, isPlayer) {
            ctx.save();
            ctx.translate(x, y);

            // Drop shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-2, 10, 54, 85);

            // Car Body
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(0, 0, 50, 90, [12, 12, 8, 8]);
            ctx.fill();

            // Roof / Rear Window Glass Area
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.roundRect(7, 25, 36, 45, [6, 6, 2, 2]);
            ctx.fill();

            ctx.fillStyle = '#263238'; // Glass reflection
            ctx.fillRect(10, 30, 30, 25);

            // Wheels
            ctx.fillStyle = '#000';
            ctx.fillRect(-6, 15, 6, 20);
            ctx.fillRect(50, 15, 6, 20);
            ctx.fillRect(-6, 65, 6, 20);
            ctx.fillRect(50, 65, 6, 20);

            // Tail Lights (Glowing)
            ctx.fillStyle = isPlayer ? '#ff1744' : '#ff5252';
            ctx.shadowColor = '#ff1744';
            ctx.shadowBlur = 10;
            ctx.fillRect(4, 3, 10, 5);
            ctx.fillRect(36, 3, 10, 5);

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Sky / Horizon Background
            ctx.fillStyle = '#4fc3f7';
            ctx.fillRect(0, 0, canvas.width, 200);

            // River / Water on sides (like the bridge screenshot)
            ctx.fillStyle = '#0288d1';
            ctx.fillRect(0, 200, canvas.width, canvas.height - 200);

            // Water waves effect
            ctx.strokeStyle = '#29b6f6';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i = 220; i < canvas.height; i += 40) {
                ctx.moveTo(0, i + (roadOffset/2));
                ctx.lineTo(canvas.width, i + (roadOffset/2));
            }
            ctx.stroke();

            // 2. The Bridge Road (Asphalt)
            ctx.fillStyle = '#37474f';
            ctx.beginPath();
            // 3D perspective road shape (wider at bottom, narrower at top horizon)
            ctx.moveTo(70, 200);
            ctx.lineTo(330, 200);
            ctx.lineTo(350, canvas.height);
            ctx.lineTo(50, canvas.height);
            ctx.fill();

            // Bridge Side Railings (Barriers)
            ctx.strokeStyle = '#cfd8dc';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(70, 200); ctx.lineTo(50, canvas.height);
            ctx.moveTo(330, 200); ctx.lineTo(350, canvas.height);
            ctx.stroke();

            // Lane Dividers (Dashed lines moving down)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.setLineDash([30, 30]);
            ctx.lineDashOffset = -roadOffset;
            
            // Center line
            ctx.beginPath();
            ctx.moveTo(200, 200);
            ctx.lineTo(200, canvas.height);
            ctx.stroke();

            ctx.setLineDash([]);

            // 3. Draw Traffic Cars (Obstacles)
            obstacles.forEach(obs => {
                drawCar(obs.x, obs.y, obs.color, false);
            });

            // 4. Draw Player Car (Sporty Red Car from behind)
            drawCar(car.x, car.y, '#e53935', true);
        }

        function loop() {
            update();
            draw();
            if (gameActive) {
                requestAnimationFrame(loop);
            }
        }

        draw();
    </script>
</body>
</html>
